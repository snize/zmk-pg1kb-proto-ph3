# 単4アルカリ乾電池の残量測定（右手側と同じ設定。BAT_CHECK は AIN3 / P0.05）
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_MAX_MV=1500
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=0

# PMW3610 を選んだ場合のみ有効な設定 (uncomment and edit as needed)
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12

# Deep Sleep（1時間の無操作で電源断）。左右は独立して眠るので両方に書く。
# non-lipo モジュールが ZMK_SLEEP を強制しなくなったため、明示的に有効化している。
# 眠らせたくないときはこの2行をコメントアウトする。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ===== DYA Studio（peripheral 側） =====
# 左手側は Studio RPC を持たないので *_STUDIO_RPC は入れない。
# central から中継されてくる設定を受け取り、保存するために必要なぶんだけ有効にする。
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_BATTERY_HISTORY=y
